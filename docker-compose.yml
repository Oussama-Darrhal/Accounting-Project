services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: compta
      POSTGRES_USER: compta
      POSTGRES_PASSWORD: compta
    ports:
      - "5432:5432"
    volumes:
      - compta_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compta -d compta"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  compta_pg:
